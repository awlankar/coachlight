name: coachlight
description: >-
  Spotlight coach marks for Flutter. Dims the screen, highlights one widget at
  a time and explains it in a small card. No dependencies beyond Flutter.
version: 0.1.0
# repository: https://github.com/<you>/coachlight   # add before publishing
publish_to: 'none' # remove when ready to publish on pub.dev

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
