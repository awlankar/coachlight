name: coachlight
description: >-
  Spotlight coach marks for Flutter. Dims the screen, highlights one widget at
  a time and explains it in a small card. No dependencies beyond Flutter.
version: 0.1.1
repository: https://github.com/awlankar/coachlight
issue_tracker: https://github.com/awlankar/coachlight/issues

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
